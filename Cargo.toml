[package]
name = "partyline"
# Bumping this and pushing to main publishes release v<version> (.github/workflows/release.yml),
# which installed copies then update to.
version = "0.4.2"
edition = "2024"

[dependencies]
anyhow = "1"
# Clipboard without the terminal's help (GNOME's VTE ignores OSC 52).
arboard = { version = "3", default-features = false }
# Only to turn on use-dev-tty for ratatui's crossterm: keys are read with poll/select instead of
# mio, because macOS kqueue can't watch /dev/tty (stdin when install.sh starts the game) and
# input fails with "Failed to initialize input reader".
crossterm = { version = "0.29", default-features = false, features = ["use-dev-tty"] }
fastrand = "2"
font8x8 = "0.3"
iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
png = "0.18"
postcard = { version = "1", features = ["use-std"] }
ratatui = "0.30"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Self-update from GitHub Releases; rustls so no OS TLS library is needed.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
