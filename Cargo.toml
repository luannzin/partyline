[package]
name = "partyline"
# Bumping this and pushing to main publishes release v<version> (.github/workflows/release.yml),
# which installed copies then update to.
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
fastrand = "2"
font8x8 = "0.3"
iroh = "1.4"
iroh-mdns-address-lookup = "0.6"
n0-future = "0.3"
png = "0.18"
postcard = { version = "1", features = ["use-std"] }
ratatui = "0.30"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# Self-update from GitHub Releases; rustls so no OS TLS library is needed.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
